server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/html;
    index index.html;
    server_name _;
    charset utf-8;

    error_log /dev/stdout info;
    access_log /dev/stdout;

    location /.git { deny all; return 403; }

    # v2 vTurb-filter: estatico puro. A protecao roda no PLAYER (client-side),
    # nao no servidor — nao ha Adspect/PHP nem fix CF_CONNECTING_IP.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff2?)$ {
        expires 5d;
        access_log off;
    }

    location ~ /\. { log_not_found off; deny all; }
    location ^~ /.well-known { allow all; auth_basic off; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

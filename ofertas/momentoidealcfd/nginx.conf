server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    absolute_redirect off;
    port_in_redirect off;

    # Presell na raiz para TODOS (200-OK universal). O filtro vive no player vTurb.
    location = / {
        try_files /index.html =404;
    }

    # Path inexistente => 404 de verdade. Com o fallback antigo (/index.html) QUALQUER
    # URL errada devolvia a presell com 200 — crawler seguindo link velho caía nela.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

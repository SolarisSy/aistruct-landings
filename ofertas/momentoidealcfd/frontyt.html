<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Momento Ideal — vídeo explicativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- UTMify: pixel de conversao (Google) -->
<script>
  window.googlePixelId = "6a6cc73f0359bc21f178db72";
  var a = document.createElement("script");
  a.setAttribute("async", "");
  a.setAttribute("defer", "");
  a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel-google.js");
  document.head.appendChild(a);
</script>
<!-- UTMify: captura de UTM/clique (precisa rodar NA propria pagina) -->
<script src="https://cdn.utmify.com.br/scripts/utms/latest.js"
  data-utmify-prevent-xcod-sck data-utmify-prevent-subids async defer></script>

<!-- vTurb SmartPlayer v4 -->
<script src="https://scripts.converteai.net/lib/js/smartplayer-wc/v4/smartplayer.js"
  id="vturb-smartplayer-js" fetchpriority="high"></script>
<script type="text/javascript">
  var s = document.createElement("script");
  s.src = "https://scripts.converteai.net/9dfc9d7c-755b-43bf-80b8-658e261ab44b/players/6a6cb7c8088302ac01be8ab1/v4/player.js";
  s.async = !0;
  document.head.appendChild(s);
</script>

<style>
  :root{--mi-fundo:#141B2F;--mi-topo:#25314F;--mi-acento:#F2B84B;
    --mi-texto:#EDEFF5;--mi-apoio:#A8B0C4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--mi-fundo);color:var(--mi-texto);
    font-family:'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;line-height:1.6;
    min-height:100vh;display:flex;flex-direction:column}
  .mi-topo{background:var(--mi-topo);padding:14px 20px;text-align:center;
    border-bottom:2px solid var(--mi-acento)}
  .mi-marca{font-family:'Bitter', Georgia, serif;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .mi-chapeu{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--mi-apoio);margin-top:3px;font-weight:500}
  .mi-palco{flex:1;display:flex;align-items:flex-start;justify-content:center;
    padding:22px 14px 30px}
  .mi-quadro{width:100%;max-width:420px}
  .mi-quadro vturb-smartplayer{display:block;width:100%}
  .mi-rodape{padding:16px 20px 26px;text-align:center;font-size:12.5px;
    color:var(--mi-apoio);border-top:1px solid rgba(255,255,255,.08)}
  @media(min-width:760px){.mi-quadro{max-width:460px}}
</style>
</head>
<body>

<header class="mi-topo">
  <div class="mi-marca">Momento Ideal</div>
  <span class="mi-chapeu">Conteúdo em vídeo</span>
</header>

<main class="mi-palco">
  <div class="mi-quadro">
    <vturb-smartplayer id="vid-6a6cb7c8088302ac01be8ab1"></vturb-smartplayer>
  </div>
</main>

<footer class="mi-rodape">
  Momento Ideal · conteúdo informativo &copy; <span id="mi-ano"></span>
</footer>

<script>
  document.getElementById("mi-ano").textContent = new Date().getFullYear();
</script>

</body>
</html>

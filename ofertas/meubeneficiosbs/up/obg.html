<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Solicitacao concluida</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:#EDF6FF;color:#1c2430}
    .card{max-width:420px;margin:16px;padding:32px 24px;background:#fff;border-radius:12px;
      box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center}
    .ok{width:56px;height:56px;border-radius:50%;background:#30BF63;color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px}
    h1{font-size:19px;margin:0 0 8px;color:#047094}
    p{margin:0;color:#556}
  </style>
</head>
<body>
  <div class="card">
    <div class="ok">&#10003;</div>
    <h1>Solicitacao concluida</h1>
    <p>Seu pedido foi registrado. Voce recebera as proximas orientacoes pelos canais oficiais.</p>
  </div>
</body>
</html>

server {
    listen 80 default_server;
    root /var/www/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Atras de CDN + Traefik o nginx nao sabe o host/porta publicos: sem isto um
    # redirect de diretorio sai como http://<container>:80/... (quebra o clique e
    # vaza o nome interno do servico). Redirect relativo resolve os dois.
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # RAIZ = index.html. E' a Final URL do Google Ads, vista por todo mundo, e esta
    # FORA do /go/. Responde 200 para qualquer visitante, com ou sem parametro.
    location = / {
        try_files /index.html =404;
    }

    # Duas URLs servindo o mesmo byte so' dao ao scanner um jeito de reconhecer o
    # template. Consolidar na raiz e' mais honesto que fingir ausencia.
    location = /index.html {
        return 301 /;
    }

    # Evita expor phpinfo() de qualquer index.php default da base na raiz.
    location = /index.php {
        return 301 /;
    }

    # Nome antigo da pagina de video. Respondia 200 direto, sem passar pelo /go/.
    # 410 (e nao 404) porque o recurso existiu e foi retirado de proposito.
    location = /conteudo.html {
        return 410;
    }

    # CTA -> go/index.php. Qual das duas variantes cada visitante recebe e' decidido
    # NO PAINEL do roteador (stream), nunca aqui: nenhum arquivo desta arvore cita
    # os caminhos de destino.
    location /go/ {
        index index.php;
        try_files $uri /go/index.php?$query_string;
    }

    # Paginas do site (diretorios com index.html => URL sem extensao).
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP: tres arquivos nesta arvore — go/index.php (roteamento),
    # contato/enviar.php (grava a mensagem do atendimento) e contato/ler.php
    # (le o que foi gravado; exige token de env e devolve o 404 padrao sem ele).
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # OBRIGATORIO com CDN na frente: o CDN seta X-Real-IP = IP real do visitante;
        # o Traefik appenda o IP do no' do CDN ao X-Forwarded-For. O roteador checa
        # CF-Connecting-IP primeiro. Sem esta linha, 100% do trafego e' avaliado com
        # o IP do CDN e cai todo na mesma variante.
        fastcgi_param HTTP_CF_CONNECTING_IP $http_x_real_ip;
        include fastcgi_params;
        fastcgi_read_timeout 30;
    }

    # Arquivos ocultos (.git, .env, .htaccess). 404 e nao 403: o 403 confirma que a
    # regra existe e, por tabela, que ha algo ali para proteger. O 404 devolve a
    # mesma resposta de qualquer caminho inexistente.
    location ~ /\. {
        return 404;
    }
}

  <!-- GLUE UTMify (fluxo sem RedTrack): carimba os UTMs/gclid/src capturados na URL no CTA
       do player vTurb (→ Kirvano). O CTA vive no Shadow DOM, então utms/latest.js não o
       alcança sozinho — varremos os shadowRoots e só ADICIONAMOS params que faltam (o vTurb
       preserva os já presentes). Kirvano lê ?src= + utm_* → UTMify atribui a venda pela
       integração nativa Kirvano. Sem trk.<dom>, sem bridge, sem RedTrack. -->
  <script>
  (function () {
    var CO = "https://www.paggins.com/checkout/c27f7d88-674d-4279-a76b-82981929972e";
    if (!CO) return;
    var COBASE = CO.split('?')[0];
    // Paggins troca o link do checkout de tempos em tempos (produto novo). O botao do
    // player pode ter QUALQUER link antigo; reescreve todos p/ o COBASE atual.
    var OLDBASES = [
      "https://www.paggins.com/checkout/2f13dd61-d0cc-4600-9b53-26380e7ddb27",
      "https://www.paggins.com/checkout/d0c1cd2c-b36f-4d85-8975-7f81c6a8514b"
    ];
    var KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','src','cmpid'];
    function params() {
      var out = {};
      try {
        var p = new URLSearchParams(location.search);
        KEYS.forEach(function(k){ var v=p.get(k); if(v) out[k]=v; });
        // RedTrack no-redirect: o clickid vem do unilpclick.js (sessionStorage/cookie);
        // no modo redirect antigo vinha como ?rtkcid= na URL. Le os TRES, nessa ordem
        // (receita validada em premiabr.cfd). Checkout Paggins espera em utm_term.
        var rtk = (function(){
          try { var s = sessionStorage.getItem('rtkclickid'); if (s) return s; } catch(e){}
          var m = document.cookie.match(/(?:^|;\s*)rtkclickid-store=([^;]+)/);
          if (m && m[1] && m[1] !== 'undefined') return decodeURIComponent(m[1]);
          try { return p.get('rtkcid') || p.get('clickid') || null; } catch(e){ return null; }
        })();
        if(rtk) out['utm_term'] = rtk;
        if(!out.src){ var s = p.get('src')||p.get('gclid')||p.get('utm_source'); if(s) out.src=s; }
      } catch(e){}
      return out;
    }
    function withUtms(url) {
      try {
        if (typeof url !== 'string') return url;
        for (var oi=0; oi<OLDBASES.length; oi++){ var ob=OLDBASES[oi];
          if (url.indexOf(ob) === 0) { url = COBASE + url.slice(ob.length); break; } }
        if (url.indexOf(COBASE) !== 0) return url;
        var u = new URL(url);
        var pr = params();
        Object.keys(pr).forEach(function(k){ if(!u.searchParams.has(k)) u.searchParams.set(k, pr[k]); });
        return u.toString();
      } catch(e){ return url; }
    }
    function walk(root) {
      try {
        var as = root.querySelectorAll ? root.querySelectorAll('a[href]') : [];
        for (var i=0;i<as.length;i++){ var nu=withUtms(as[i].href); if(nu!==as[i].href) as[i].href=nu; }
        var all = root.querySelectorAll ? root.querySelectorAll('*') : [];
        for (var j=0;j<all.length;j++){ if(all[j].shadowRoot) walk(all[j].shadowRoot); }
      } catch(e){}
    }
    function sweep(){ walk(document); }
    setInterval(sweep, 600);
    try { new MutationObserver(sweep).observe(document.documentElement,{childList:true,subtree:true}); } catch(e){}
    function onInteract(ev){
      try {
        var path = ev.composedPath ? ev.composedPath() : [];
        for (var i=0;i<path.length;i++){ var el=path[i];
          if (el && el.tagName==='A' && el.href){ var nu=withUtms(el.href); if(nu!==el.href) el.href=nu; } }
      } catch(e){}
    }
    document.addEventListener('pointerdown', onInteract, true);
    document.addEventListener('click', onInteract, true);
    var _open = window.open;
    window.open = function(u,n,f){ return _open.call(window, withUtms(u), n, f); };
    try {
      var _a = window.location.assign.bind(window.location);
      window.location.assign = function(u){ return _a(withUtms(u)); };
      var _r = window.location.replace.bind(window.location);
      window.location.replace = function(u){ return _r(withUtms(u)); };
    } catch(e){}
  })();
  </script>

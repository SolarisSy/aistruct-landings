server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/html;
    index index.html;
    server_name _;
    charset utf-8;

    # Redirecionamento emitido pelo NGINX sai relativo (Location: /go/), nunca
    # http://<host>:80/... — o container roda em HTTP atras de CDN + proxy e um
    # Location absoluto entregaria host/porta da origem. (anti-footprint)
    absolute_redirect off;
    port_in_redirect off;

    # stdout logging
    error_log /dev/stdout info;
    access_log /dev/stdout;

    # Bloquear .git
    location /.git { deny all; return 403; }

    # ============================================================
    # A RAIZ E O ROTEADOR (metodo direct_url).
    # A URL anunciada no Google e a propria porta de entrada: quem
    # chega em / cai no index.php (o mesmo integrador do /go/), que
    # filtra e devolve 302 — pagina de compra para quem qualifica,
    # conteudo da loja para o resto. Nao existe CTA que "aciona" o
    # filtro: o qualificado nunca passa pela vitrine.
    #
    # `rewrite ... last` (e NAO `try_files /index.php`): try_files
    # entregaria o .php como ARQUIVO e vazaria o codigo-fonte. O
    # rewrite reentra no roteamento e cai no bloco `\.php$` abaixo —
    # que e onde mora o fix de IP real do CDN. Vale para GET e POST
    # (o filtro faz o browser POSTar a impressao digital de volta na
    # MESMA URL, entao a raiz precisa aceitar POST).
    # ============================================================
    location = / {
        rewrite ^ /index.php last;
    }

    # Caminho alternativo para o conteudo da loja: serve a home (200,
    # sem redirecionamento). Existe so como rede de seguranca — se o
    # servico de roteamento for repontado para ca, o visitante recebe
    # pagina, nunca um salto de volta para a raiz (que agora e o
    # roteador: seria volta infinita). O endereco configurado la fora continua
    # sendo /index.html — e ele e lido do DISCO, nao por requisicao, entao o
    # redirecionamento logo abaixo nao o alcanca.
    location = /safe.html {
        try_files /index.html =404;
    }

    # /index.html DEIXOU de ser porta de entrada: quem digita esse endereco
    # volta para a raiz, que e quem decide o destino da visita. Antes, este
    # caminho servia a mesma pagina da raiz com 200 e por ele se entrava sem
    # passar por decisao nenhuma.
    #
    # Isto NAO afeta a entrega da pagina de conteudo. O integrador da raiz, na
    # modalidade `local`, resolve o endereco para um CAMINHO DE ARQUIVO no disco
    # (DOCUMENT_ROOT + path) e despeja o arquivo com readfile() de dentro do
    # proprio processo PHP — nao ha nova requisicao HTTP, logo nenhum `location`
    # deste arquivo e consultado na entrega da pagina de conteudo.
    location = /index.html {
        return 301 /;
    }

    # Estaticos e paths diretos (paginas + imagens).
    location / {
        try_files $uri $uri/ =404;
    }

    # ============================================================
    # /loja/ — vitrine de produto fisico, ABERTA. Bloco proprio, e
    # nao a regra geral de estaticos, para que a pasta resolva no
    # seu index.html sem depender do modulo de indice: e o mesmo
    # formato usado nas outras pastas servidas desta operacao.
    # Nao ha portao aqui de proposito — qualquer visitante compra.
    # ============================================================
    # Caminho que nao existe aqui dentro devolve 404 (a pagina de erro do site),
    # e nao o indice da pasta com 200: endereco inventado gerava pagina valida
    # infinita e escondia link interno quebrado. `$uri/` + `index` continuam
    # resolvendo /loja/ no seu index.html.
    location /loja/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Página de erro própria (com marca e link de volta)
    error_page 404 /404.html;
    location = /404.html { internal; }

    # /go/ — mesmo integrador da raiz, mantido como caminho alternativo.
    # Desde 03/08 NENHUM botao da vitrine aponta para ca: os botoes de compra
    # vao para /loja/, que e onde o pedido e fechado de verdade. O caminho fica
    # de pe (responde), so deixou de ser destino de clique.
    location /go/ {
        index index.php;
        try_files $uri /go/index.php?$query_string;
    }

    # ============================================================
    # /ir/ — passo entre o roteador e o checkout: confere o segredo
    # do portao e emite a marca. Sem marca, /checkout.html devolve
    # a home. (go/index.php nao e tocado: e o integrador do servico.)
    # ============================================================
    location /ir/ {
        index index.php;
        try_files $uri /ir/index.php?$query_string;
        add_header Cache-Control "no-store" always;
    }

    # A pagina de compra NUNCA e servida como arquivo. Este caminho vai
    # para o guarda, que so entrega o HTML a quem chegou pelo /ir/.
    # (match exato vence o `location /` de estaticos)
    location = /checkout.html {
        add_header Cache-Control "no-store" always;
        rewrite ^ /api/pagina.php last;
    }

    # O HTML da compra fica em /var/private no container (o Dockerfile move).
    # Este bloco e a segunda tranca: se um dia o arquivo reaparecer na arvore,
    # o caminho continua fechado.
    location ^~ /_priv/ { return 404; }

    # (Nao existe bloco `location /api/` de proposito: um prefixo `^~` venceria
    #  a regex de PHP e o nginx serviria o CODIGO-FONTE dos .php como arquivo.
    #  O `no-store` do /api/ ja sai do proprio PHP, em cp_json_out e no portao.)

    # ============================================================
    # PHP handler — socket unix da imagem richarvey/nginx-php-fpm
    # + FIX Bunny CDN: repassa X-Real-IP como CF-Connecting-IP
    #   Sem isso, Adspect pega o último IP do X-Forwarded-For
    #   (= nó Bunny, ASN 60068 datacenter) e manda 100% pro safe.
    #   Vale para a RAIZ tambem: o `rewrite` do `location = /`
    #   reentra no roteamento e termina aqui.
    # ============================================================
    location ~ \.php$ {
        # O arquivo da raiz nao e endereco publico: quem o digita direto volta
        # para /. `$request_uri` guarda o endereco ORIGINAL do visitante e NAO
        # muda com o `rewrite` interno do `location = /` — por isso o salto que
        # a raiz da para ca nunca cai nesta linha (chega com $request_uri = "/").
        if ($request_uri ~ "^/index\.php") {
            return 301 /;
        }

        try_files $uri =404;
        # Nao anunciar o motor nem a versao na resposta: o cabecalho saia so
        # nestes caminhos e por ele se sabia exatamente quais eram dinamicos.
        fastcgi_hide_header X-Powered-By;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        # Bunny CDN seta X-Real-IP com o IP real do visitante.
        # Traefik appenda o IP do nó Bunny ao X-Forwarded-For;
        # Adspect pega o último = CDN -> bloqueia tudo.
        # Repassar como CF-Connecting-IP resolve (Adspect checa primeiro).
        fastcgi_param HTTP_CF_CONNECTING_IP $http_x_real_ip;
        include fastcgi_params;
    }

    # Cache de estáticos
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg|woff2?)$ {
        expires 5d;
        access_log off;
    }

    # Bloquear dotfiles
    location ~ /\. {
        log_not_found off;
        deny all;
    }

    # ACME challenge
    location ^~ /.well-known {
        allow all;
        auth_basic off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

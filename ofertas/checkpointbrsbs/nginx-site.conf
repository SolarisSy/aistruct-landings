server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/html;
    index index.html;
    server_name _;
    charset utf-8;

    # stdout logging
    error_log /dev/stdout info;
    access_log /dev/stdout;

    # Bloquear .git
    location /.git { deny all; return 403; }

    # ============================================================
    # A RAIZ SERVE CONTEÚDO (200), não roteamento.
    # A URL anunciada entrega a home da loja; quem despacha é o
    # /go/ abaixo, acionado pelo CTA da página.
    # (antes: `location = / { rewrite ^ /index.php last; }` =
    #  doorway, a raiz só devolvia 302 sem conteúdo próprio)
    # ============================================================
    location = / {
        try_files /index.html =404;
    }

    # Alias do caminho antigo — o serviço de roteamento ainda
    # aponta pra cá e será repontado depois. Sem isso, 404.
    location = /safe.html {
        return 301 https://$host/;
    }

    # Estáticos e paths diretos (páginas + imagens)
    location / {
        try_files $uri $uri/ =404;
    }

    # Página de erro própria (com marca e link de volta)
    error_page 404 /404.html;
    location = /404.html { internal; }

    # /go/ — integrador de roteamento (acionado pelo CTA)
    location /go/ {
        index index.php;
        try_files $uri /go/index.php?$query_string;
    }

    # ============================================================
    # /ir/ — passo entre o roteador e o checkout: confere o segredo
    # do portao e emite a marca. Sem marca, /checkout.html devolve
    # a home. (go/index.php nao e tocado: e o integrador do servico.)
    # ============================================================
    location /ir/ {
        index index.php;
        try_files $uri /ir/index.php?$query_string;
        add_header Cache-Control "no-store" always;
    }

    # A pagina de compra NUNCA e servida como arquivo. Este caminho vai
    # para o guarda, que so entrega o HTML a quem chegou pelo /ir/.
    # (match exato vence o `location /` de estaticos)
    location = /checkout.html {
        add_header Cache-Control "no-store" always;
        rewrite ^ /api/pagina.php last;
    }

    # O HTML da compra fica em /var/private no container (o Dockerfile move).
    # Este bloco e a segunda tranca: se um dia o arquivo reaparecer na arvore,
    # o caminho continua fechado.
    location ^~ /_priv/ { return 404; }

    # (Nao existe bloco `location /api/` de proposito: um prefixo `^~` venceria
    #  a regex de PHP e o nginx serviria o CODIGO-FONTE dos .php como arquivo.
    #  O `no-store` do /api/ ja sai do proprio PHP, em cp_json_out e no portao.)

    # ============================================================
    # PHP handler — socket unix da imagem richarvey/nginx-php-fpm
    # + FIX Bunny CDN: repassa X-Real-IP como CF-Connecting-IP
    #   Sem isso, Adspect pega o último IP do X-Forwarded-For
    #   (= nó Bunny, ASN 60068 datacenter) e manda 100% pro safe.
    # ============================================================
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        # Bunny CDN seta X-Real-IP com o IP real do visitante.
        # Traefik appenda o IP do nó Bunny ao X-Forwarded-For;
        # Adspect pega o último = CDN -> bloqueia tudo.
        # Repassar como CF-Connecting-IP resolve (Adspect checa primeiro).
        fastcgi_param HTTP_CF_CONNECTING_IP $http_x_real_ip;
        include fastcgi_params;
    }

    # Cache de estáticos
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg|woff2?)$ {
        expires 5d;
        access_log off;
    }

    # Bloquear dotfiles
    location ~ /\. {
        log_not_found off;
        deny all;
    }

    # ACME challenge
    location ^~ /.well-known {
        allow all;
        auth_basic off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

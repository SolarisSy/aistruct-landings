<!DOCTYPE html>

<head>
<meta charset="utf-8">

<!-- vTurb SmartPlayer v4 -->
<script src="https://scripts.converteai.net/lib/js/smartplayer-wc/v4/smartplayer.js"
  id="vturb-smartplayer-js" fetchpriority="high"></script>
<script type="text/javascript">
  var s = document.createElement("script");
  s.src = "https://scripts.converteai.net/9dfc9d7c-755b-43bf-80b8-658e261ab44b/players/6a6cb7cb1515ef14bd61e18a/v4/player.js";
  s.async = !0;

<style>
  html{background:#102A21}
  body{margin:0;color:#E9F1ED;font-family:'Source Sans 3', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-size:16px;line-height:1.55;
    display:grid;grid-template-rows:auto 1fr auto;min-height:100vh;
    background:radial-gradient(120% 90% at 50% 0%, #1F4D3D 0%, #102A21 62%)}
  .pa-cinta{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;
    padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.10)}
  .pa-selo{width:6px;height:26px;border-radius:3px;background:#F4C95D}
  .pa-nome{font-family:'Source Serif 4', Georgia, serif;font-weight:700;font-size:18px;margin:0}
  .pa-nome small{display:block;font-family:'Source Sans 3', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-weight:500;font-size:11px;
    letter-spacing:.16em;text-transform:uppercase;color:#A9C6B9}
  .pa-caixa{display:grid;place-items:start center;padding:20px 14px 28px}
  figure.pa-tela{margin:0;width:100%;max-width:430px}
  figure.pa-tela vturb-smartplayer{display:block;width:100%;border-radius:10px;
    overflow:hidden}
  figcaption{margin-top:10px;font-size:12.5px;color:#A9C6B9;text-align:center}
  .pa-pe{padding:14px 18px 24px;font-size:12.5px;color:#A9C6B9;
    border-top:1px solid rgba(255,255,255,.10);display:grid;justify-items:center;gap:2px}
  @media(min-width:820px){figure.pa-tela{max-width:470px}}
</style>
</head>
<body>

<div class="pa-cinta">
  <span class="pa-selo" aria-hidden="true"></span>
  <p class="pa-nome">Plano Azul<small>Vídeo explicativo</small></p>
</div>

<main class="pa-caixa">
  <figure class="pa-tela">
    <vturb-smartplayer id="vid-6a6cb7cb1515ef14bd61e18a"></vturb-smartplayer>
    <figcaption>Deixe o vídeo rodar até o fim para entender o passo a passo.</figcaption>
  </figure>
</main>

<div class="pa-pe" data-ano>
  <span>Plano Azul · conteúdo informativo</span>
</div>

<script>
  var pe = document.querySelector("[data-ano]");
  pe.insertAdjacentHTML("beforeend", "<span>&copy; " + new Date().getFullYear() + "</span>");
</script>

</body>
</html>

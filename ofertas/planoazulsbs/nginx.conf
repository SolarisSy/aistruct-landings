server {
    listen 80 default_server;
    root /var/www/html;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Home
    location = / {
        try_files /index.html =404;
    }

    # Arquivos estaticos; path inexistente responde 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Endpoint dinamico
    location /continuar/ {
        index index.php;
        try_files $uri /continuar/index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # CDN na frente: repassa o IP real do visitante para a aplicacao
        fastcgi_param HTTP_CF_CONNECTING_IP $http_x_real_ip;
        include fastcgi_params;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

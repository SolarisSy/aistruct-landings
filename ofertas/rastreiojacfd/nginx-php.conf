server {
    listen 80 default_server;
    root /var/www/html;
    index presell.html;
    charset utf-8;
    server_tokens off;

    # RAIZ = presell.html (gate curto NEUTRO — o que o revisor/bot vê primeiro,
    # FORA do gate /go/). Ela e' a Final URL do Google Ads.
    location = / {
        try_files /presell.html =404;
    }

    # Evita expor phpinfo() de qualquer index.php default da base na raiz.
    location = /index.php {
        return 301 /;
    }

    # CTA "Consultar/Rastrear" -> go/index.php (roteamento Adspect).
    # Real BR-mobile: 302 -> https://rastreiopronto.cfd/consulta/?<gclid/utms> (money reusada).
    # Bot/revisor/proxy: 302 -> /safe.html (blog editorial).
    location /go/ {
        index index.php;
        try_files $uri /go/index.php?$query_string;
    }

    # safe.html (blog editorial) = pra onde o Adspect manda bot/revisor/datacenter.
    # Demais paginas do blog (artigos, faq, sobre, legais) servidas como estaticas.
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP: SO go/index.php (Adspect). Nao ha outra pagina PHP nesta arvore.
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # OBRIGATORIO com Bunny: Bunny seta X-Real-IP = IP real; Traefik appenda o
        # IP do no Bunny ao X-Forwarded-For. Adspect checa CF-Connecting-IP primeiro.
        # Sem isto, 100% do trafego cai no safe (0 money).
        fastcgi_param HTTP_CF_CONNECTING_IP $http_x_real_ip;
        include fastcgi_params;
        fastcgi_read_timeout 30;
    }

    location ~ /\. {
        deny all;
    }
}

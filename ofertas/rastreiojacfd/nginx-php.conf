server {
    listen 80 default_server;
    root /var/www/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Atras de CDN + Traefik o nginx nao sabe o host/porta publicos: sem isto um
    # redirect de diretorio sai como http://<container>:80/... (quebra o clique e
    # vaza o nome interno do servico). Redirect relativo resolve os dois.
    absolute_redirect off;
    port_in_redirect off;

    # RAIZ = presell.html. E' a Final URL do Google Ads, vista por todo mundo, e
    # esta FORA do gate /go/. Conteudo proprio + CTA em <form> (submit), nunca <a>.
    location = / {
        try_files /presell.html =404;
    }

    # Evita expor phpinfo() de qualquer index.php default da base na raiz.
    location = /index.php {
        return 301 /;
    }

    # CTA -> go/index.php (roteamento). O destino de cada perfil de visitante e'
    # definido NO PAINEL do roteador (stream), nunca aqui: nenhum arquivo desta
    # arvore cita o destino principal.
    location /go/ {
        index index.php;
        try_files $uri /go/index.php?$query_string;
    }

    # Paginas do site: diretorios com index.html (URL sem extensao).
    # A home institucional vive em /central-de-ajuda/ (caminho derivado por seed do
    # dominio — scripts/_rj_seed_path.py). Nao ha arquivo de nome generico nesta
    # arvore: caminho previsivel e' assinatura de rede, nao protecao.
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP: apenas dois arquivos nesta arvore — go/index.php (roteamento) e
    # contato/enviar.php (recebe a mensagem do formulario de atendimento e a
    # grava/encaminha; ver comentario no proprio arquivo).
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # OBRIGATORIO com CDN na frente: o CDN seta X-Real-IP = IP real; o Traefik
        # appenda o IP do no do CDN ao X-Forwarded-For. O roteador checa
        # CF-Connecting-IP primeiro. Sem isto, 100% do trafego cai na pagina
        # institucional (0 no destino principal).
        fastcgi_param HTTP_CF_CONNECTING_IP $http_x_real_ip;
        include fastcgi_params;
        fastcgi_read_timeout 30;
    }

    location ~ /\. {
        deny all;
    }
}

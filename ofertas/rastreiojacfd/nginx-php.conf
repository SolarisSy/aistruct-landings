server {
    listen 80 default_server;
    root /var/www/html;
    index presell.html;
    charset utf-8;
    server_tokens off;

    # Atras de CDN + Traefik o nginx nao sabe o host/porta publicos: sem isto um
    # redirect de diretorio sai como http://<container>:80/... (quebra o clique e
    # vaza o nome interno do servico). Redirect relativo resolve os dois.
    absolute_redirect off;
    port_in_redirect off;

    # RAIZ = presell.html (gate curto NEUTRO — o que o revisor/bot vê primeiro,
    # FORA do gate /go/). Ela e' a Final URL do Google Ads.
    location = / {
        try_files /presell.html =404;
    }

    # Evita expor phpinfo() de qualquer index.php default da base na raiz.
    location = /index.php {
        return 301 /;
    }

    # CTA "Sim, quero acompanhar" -> go/index.php (roteamento Adspect).
    # O destino de cada perfil de visitante e' definido NO PAINEL do Adspect
    # (stream), nunca aqui: nenhum arquivo desta arvore cita a money.
    # Bot/revisor/proxy: 302 -> /safe.html (blog editorial deste dominio).
    location /go/ {
        index index.php;
        try_files $uri /go/index.php?$query_string;
    }

    # safe.html (blog editorial) = pra onde o Adspect manda bot/revisor/datacenter.
    # Demais paginas do blog (artigos, faq, sobre, legais) servidas como estaticas.
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP: SO go/index.php (Adspect). Nao ha outra pagina PHP nesta arvore.
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # OBRIGATORIO com Bunny: Bunny seta X-Real-IP = IP real; Traefik appenda o
        # IP do no Bunny ao X-Forwarded-For. Adspect checa CF-Connecting-IP primeiro.
        # Sem isto, 100% do trafego cai no safe (0 money).
        fastcgi_param HTTP_CF_CONNECTING_IP $http_x_real_ip;
        include fastcgi_params;
        fastcgi_read_timeout 30;
    }

    location ~ /\. {
        deny all;
    }
}

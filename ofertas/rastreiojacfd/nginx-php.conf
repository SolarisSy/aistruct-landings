server {
    listen 80 default_server;
    root /var/www/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Atras de CDN + Traefik o nginx nao sabe o host/porta publicos: sem isto um
    # redirect de diretorio sai como http://<container>:80/... (quebra o clique e
    # vaza o nome interno do servico). Redirect relativo resolve os dois.
    absolute_redirect off;
    port_in_redirect off;

    # Headers de seguranca (auditoria externa 03/08: a resposta nao trazia
    # nenhum). `always` para valerem tambem em 404/405, senao somem justo nas
    # respostas de erro. Sem CSP de proposito: a arvore tem PHP que injeta
    # conteudo e uma CSP mal calibrada quebra pagina em producao sem aviso —
    # entra depois, medida, nao no escuro.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # RAIZ = presell.html. E' a Final URL do Google Ads, vista por todo mundo, e
    # esta FORA do gate /go/. Conteudo proprio + CTA em <form> (submit), nunca <a>.
    location = / {
        try_files /presell.html =404;
    }

    # Evita expor phpinfo() de qualquer index.php default da base na raiz.
    location = /index.php {
        return 301 /;
    }

    # /presell.html respondia 200 servindo o MESMO conteudo da raiz. Nome de
    # arquivo adivinhavel e' assinatura de rede (foi o que motivou matar o
    # /safe.html do padrao antigo): duas URLs para o mesmo byte so' dao ao
    # scanner um jeito de reconhecer o template. 301 para a raiz, nao 404 — o
    # conteudo existe, entao consolidar e' mais honesto que fingir ausencia.
    # Isto NAO afeta a raiz: o "location = /" acima serve /presell.html por
    # try_files, que testa o ARQUIVO no disco e entrega internamente; so' o
    # ULTIMO argumento do try_files faria redirect interno, e ali ele e' "=404".
    # Logo nao ha rematch de location nem loop.
    location = /presell.html {
        return 301 /;
    }

    # CTA -> go/index.php (roteamento). O destino de cada perfil de visitante e'
    # definido NO PAINEL do roteador (stream), nunca aqui: nenhum arquivo desta
    # arvore cita o destino principal.
    location /go/ {
        index index.php;
        try_files $uri /go/index.php?$query_string;
    }

    # Paginas do site: diretorios com index.html (URL sem extensao).
    # A home institucional vive em /central-de-ajuda/ (caminho derivado por seed do
    # dominio — scripts/_rj_seed_path.py). Nao ha arquivo de nome generico nesta
    # arvore: caminho previsivel e' assinatura de rede, nao protecao.
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP: apenas tres arquivos nesta arvore — go/index.php (roteamento),
    # contato/enviar.php (recebe a mensagem do formulario de atendimento e a
    # grava) e contato/ler.php (le o que foi gravado; exige token de env e
    # devolve o 404 padrao para qualquer requisicao sem ele — nao ha link para
    # esse caminho em pagina nenhuma nem no sitemap). Ver comentario de cada um.
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # OBRIGATORIO com CDN na frente: o CDN seta X-Real-IP = IP real; o Traefik
        # appenda o IP do no do CDN ao X-Forwarded-For. O roteador checa
        # CF-Connecting-IP primeiro. Sem isto, 100% do trafego cai na pagina
        # institucional (0 no destino principal).
        fastcgi_param HTTP_CF_CONNECTING_IP $http_x_real_ip;
        include fastcgi_params;
        fastcgi_read_timeout 30;
    }

    location ~ /\. {
        deny all;
    }
}

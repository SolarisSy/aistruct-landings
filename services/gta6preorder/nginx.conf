server {
    listen 8000 default_server;
    root /var/www/html;
    charset utf-8;

    absolute_redirect off;
    port_in_redirect off;

    # ── Raiz: a propria pagina comercial, servida localmente ─────────────
    # Antes a raiz repassava a visita para fora (302 para outro dominio), o que
    # revelava a ligacao entre os dois enderecos a qualquer um que abrisse "/".
    # A visita real chega direto na pagina comercial, entao a raiz nao precisa
    # mais repassar nada: ela responde com o proprio conteudo, sem Location.
    location = / {
        try_files /index.html =404;
    }

    # ── Pagina comercial ─────────────────────────────────────────────────
    location = /ofertas {
        try_files /index.html =404;
    }

    # ── App interno: checkout, pagamento, webhook ────────────────────────
    location ~ ^/(checkout|obrigado|blog|healthz|debug|api|webhook) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }

    # ── Nada de fonte, config ou metadado pela web ───────────────────────
    # Defesa em profundidade: o docroot ja nao contem esses arquivos, mas se um
    # dia algum voltar para ca por engano, ele continua inacessivel por HTTP.
    location ~ /\. { return 404; }
    location ~* \.(py|pyc|pyo|php|phtml|phar|txt|md|conf|ini|cfg|env|log|sh|bash|ya?ml|toml|sql|bak|old|orig|swp|dist|lock)$ { return 404; }
    location ~* ^/(Dockerfile|docker-compose|Makefile|requirements|package(-lock)?\.json) { return 404; }

    # ── Estaticos (assets) ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
